name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run when new commits land on the same ref. Without this,
# a branch pushed three times runs three full suites and the two older ones are
# only useful for burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `next build` and the unit tests both evaluate src/core/env.ts, which requires
  # this. A placeholder is fine — nothing here verifies a real signature.
  AUTH_SECRET: ci-placeholder-secret-do-not-use-in-production

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # setup-bun installs the runtime but not the package cache. Keyed on the
      # lockfile, so it invalidates exactly when dependencies change.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # setup-bun installs the runtime but not the package cache. Keyed on the
      # lockfile, so it invalidates exactly when dependencies change.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # No database service: the unit tests run against SQLite in :memory: and the
  # e2e run creates its own file. That's the whole benefit of dropping Postgres.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # setup-bun installs the runtime but not the package cache. Keyed on the
      # lockfile, so it invalidates exactly when dependencies change.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  # Its own job even though the e2e job below also builds. A build failure here
  # says "the build broke"; the same failure inside e2e surfaces as a webServer
  # timeout, which is a much longer trip to the same answer.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # setup-bun installs the runtime but not the package cache. Keyed on the
      # lockfile, so it invalidates exactly when dependencies change.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # setup-bun installs the runtime but not the package cache. Keyed on the
      # lockfile, so it invalidates exactly when dependencies change.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      # Browsers are ~150 MB and change only with the Playwright version, so the
      # key is that version rather than the lockfile hash. Read out of the lockfile
      # so it can't drift from what's installed.
      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(bun pm ls | grep -o '@playwright/test@[0-9.]*' | head -1 | cut -d@ -f3)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # --with-deps installs system libraries, which the cache does not cover, so
      # it still has to run on a hit — just without the browser download.
      - run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # playwright.config.ts's webServer runs db:reset (migrate + seed) against
      # ./data/e2e.db before starting the app.
      - run: bun run test:e2e

      # The report is only interesting when something failed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
